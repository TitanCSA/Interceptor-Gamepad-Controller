[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"
[project]
name = "interceptor-gamepad-controller"
version = "1.0.0"
description = "Direct Windows x64 Interceptor-Gamepad-Controller input SDK with native receive, edit, send, descriptors and cancellation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
[project.urls]
Repository = "https://github.com/TitanCSA/Interceptor-Gamepad-Controller"
Documentation = "https://github.com/TitanCSA/Interceptor-Gamepad-Controller/tree/main/Interceptor-Gamepad-Controller-Python-pypi/docs"
[tool.setuptools]
packages = ["interceptor_gamepad_controller"]
[tool.setuptools.package-data]
interceptor_gamepad_controller = ["InterceptorGamepadControllerBridge.dll"]
[tool.setuptools.data-files]
"share/doc/interceptor-gamepad-controller" = ["docs/API.md", "examples/info.py", "LICENSE"]
